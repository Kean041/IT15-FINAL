name: Deploy FinSight to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: windows-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ vars.PROJECT_PATH }}"

      - name: Build application
        run: dotnet build "${{ vars.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish "${{ vars.PROJECT_PATH }}" --configuration Release --output "./publish" --runtime "${{ vars.PUBLISH_RUNTIME }}" --self-contained false

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}