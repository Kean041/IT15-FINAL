name: Deploy FinSight to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH_RUNTIME: ${{ vars.PUBLISH_RUNTIME || 'win-x64' }}
  PROJECT_PATH: ${{ vars.PROJECT_PATH || 'FinSight.csproj' }}
  DOTNET_VERSION: ${{ vars.DOTNET_VERSION || '8.0.x' }}

jobs:
  build-and-deploy:
    runs-on: windows-latest
    env:
      DEPLOY_WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
      DEPLOY_SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME || format('https://{0}.siteasp.net:8172', secrets.WEBSITE_NAME) }}
      DEPLOY_SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
      DEPLOY_SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      APP_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
      APP_SEED_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      APP_SEED_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      APP_SEED_ADMIN_NAME: ${{ secrets.ADMIN_NAME || 'Demo Admin' }}
      APP_SEED_ADMIN_COMPANY_NAME: ${{ secrets.ADMIN_COMPANY_NAME || 'FinSight Demo' }}

    steps:
      - name: Validate deployment settings
        shell: pwsh
        run: |
          $missing = @()

          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_WEBSITE_NAME)) { $missing += "WEBSITE_NAME" }
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_SERVER_USERNAME)) { $missing += "SERVER_USERNAME" }
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_SERVER_PASSWORD)) { $missing += "SERVER_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_SERVER_COMPUTER_NAME)) { $missing += "SERVER_COMPUTER_NAME or WEBSITE_NAME" }
          if ([string]::IsNullOrWhiteSpace($env:APP_CONNECTION_STRING)) { $missing += "DB_CONNECTION_STRING" }
          if ([string]::IsNullOrWhiteSpace($env:APP_SEED_ADMIN_EMAIL)) { $missing += "ADMIN_EMAIL" }
          if ([string]::IsNullOrWhiteSpace($env:APP_SEED_ADMIN_PASSWORD)) { $missing += "ADMIN_PASSWORD" }

          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions secret(s): $($missing -join ', '). Add them in Settings > Secrets and variables > Actions."
          }

          if ($env:DEPLOY_SERVER_COMPUTER_NAME -notmatch '^https?://[^/]+(:\d+)?$') {
            throw "SERVER_COMPUTER_NAME must be a Web Deploy base URL, for example https://siteXXXX.siteasp.net:8172."
          }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build application
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --output "./publish" --runtime "${{ env.PUBLISH_RUNTIME }}" --self-contained true

      - name: Configure production settings
        shell: pwsh
        run: |
          $webConfigPath = (Resolve-Path "./publish/web.config").Path
          [xml]$webConfig = Get-Content $webConfigPath
          $aspNetCore = $webConfig.configuration.location.'system.webServer'.aspNetCore

          $aspNetCore.SetAttribute("stdoutLogEnabled", "true")
          $aspNetCore.SetAttribute("stdoutLogFile", ".\logs\stdout")

          $environmentVariables = $aspNetCore.environmentVariables
          if ($null -eq $environmentVariables) {
            $environmentVariables = $webConfig.CreateElement("environmentVariables")
            [void]$aspNetCore.AppendChild($environmentVariables)
          }

          function Set-EnvironmentVariable([string]$name, [string]$value) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              return
            }

            $existing = $environmentVariables.SelectSingleNode("add[@name='$name']")
            if ($null -eq $existing) {
              $existing = $webConfig.CreateElement("add")
              [void]$existing.SetAttribute("name", $name)
              [void]$environmentVariables.AppendChild($existing)
            }

            [void]$existing.SetAttribute("value", $value)
          }

          Set-EnvironmentVariable "ASPNETCORE_ENVIRONMENT" "Production"
          Set-EnvironmentVariable "ConnectionStrings__DefaultConnection" $env:APP_CONNECTION_STRING
          Set-EnvironmentVariable "SeedUsers__AdminEmail" $env:APP_SEED_ADMIN_EMAIL
          Set-EnvironmentVariable "SeedUsers__AdminPassword" $env:APP_SEED_ADMIN_PASSWORD
          Set-EnvironmentVariable "SeedUsers__AdminName" $env:APP_SEED_ADMIN_NAME
          Set-EnvironmentVariable "SeedUsers__AdminCompanyName" $env:APP_SEED_ADMIN_COMPANY_NAME

          New-Item -ItemType Directory -Path "./publish/logs" -Force | Out-Null
          $webConfig.Save($webConfigPath)

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ env.DEPLOY_WEBSITE_NAME }}
          server-computer-name: ${{ env.DEPLOY_SERVER_COMPUTER_NAME }}
          server-username: ${{ env.DEPLOY_SERVER_USERNAME }}
          server-password: ${{ env.DEPLOY_SERVER_PASSWORD }}
